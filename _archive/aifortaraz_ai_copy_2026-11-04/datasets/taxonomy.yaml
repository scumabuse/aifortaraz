# Unified taxonomy (spec 6.1) and every source-class mapping (spec 6.2).
# `names` defines the class ids used for training and at runtime, in this exact order; it must equal
# safety_ai.inference.types.TAXONOMY (enforced by tests/unit/test_taxonomy.py).
# Source classes that are not listed in `map` are dropped. `verified_against` records where each
# source class list was checked (spec 6.2: verify against the dataset's own data.yaml/README).

names:
  - person
  - head
  - face
  - hands
  - foot
  - ear
  - helmet
  - vest
  - glasses
  - gloves
  - mask
  - boots
  - earmuffs
  - face_shield
  - harness
  - forklift
  - vehicle
  - tools

ppe_codes: [helmet, vest, glasses, gloves, mask, boots, earmuffs, harness, face_shield]
bare_parts: [head, face, hands, foot, ear]
minority_classes: [face_shield, earmuffs, harness, forklift]

sources:
  sh17:
    title: SH17 — Safe Human dataset (manufacturing PPE)
    licence: CC BY-NC-SA 4.0
    verified_against: sh17.yaml in github.com/ahmadmughees/SH17dataset (branch master), checked 2026-11-04
    names: [person, ear, ear-mufs, face, face-guard, face-mask, foot, tool, glasses, gloves, helmet, hands, head, medical-suit, shoes, safety-suit, safety-vest]
    map:
      person: person
      ear: ear
      ear-mufs: earmuffs
      face: face
      face-guard: face_shield
      face-mask: mask
      foot: foot
      tool: tools
      glasses: glasses
      gloves: gloves
      helmet: helmet
      hands: hands
      head: head
      shoes: boots
      safety-vest: vest
    drop: [medical-suit, safety-suit]

  css:
    title: Construction Site Safety (Roboflow Universe, Kaggle mirror)
    licence: CC BY 4.0
    verified_against: pending — checked against the downloaded data.yaml by `safety-ai data convert`
    names: [Hardhat, Mask, NO-Hardhat, NO-Mask, NO-Safety Vest, Person, Safety Cone, Safety Vest, machinery, vehicle]
    map:
      Hardhat: helmet
      NO-Hardhat: head
      Mask: mask
      NO-Mask: face
      Safety Vest: vest
      Person: person
      machinery: vehicle
      vehicle: vehicle
    drop: [Safety Cone, NO-Safety Vest]
    eval_only: [NO-Safety Vest]

  hardhat:
    title: Hard Hat Workers (Kaggle andrewmvd/hard-hat-detection)
    licence: CC0 1.0
    verified_against: pending — checked against the downloaded annotations by `safety-ai data convert`
    names: [helmet, head, person]
    map:
      helmet: helmet
      head: head
      person: person
    drop: []

  chv:
    title: CHV — Color Helmet and Vest (github.com/ZijianWang-ZW/PPE_detection)
    licence: free use with citation (see repository README)
    verified_against: pending — checked against the downloaded data.yaml by `safety-ai data convert`
    names: [person, vest, blue, red, white, yellow]
    map:
      person: person
      vest: vest
      blue: helmet
      red: helmet
      white: helmet
      yellow: helmet
    drop: []

  forklift:
    title: Forklift detection dataset(s)
    licence: per dataset, recorded in docs/TRAINING.md
    verified_against: pending
    names: [forklift]
    map:
      forklift: forklift
    drop: []

  harness:
    title: Safety-harness detection dataset(s)
    licence: per dataset, recorded in docs/TRAINING.md
    verified_against: pending
    names: [harness]
    map:
      harness: harness
    drop: []

  coco:
    title: COCO (runtime vehicle fallback, spec 5.3)
    licence: CC BY 4.0
    verified_against: ultralytics yolo26n.pt model.names
    names: [person, car, truck, bus]
    map:
      person: person
      car: vehicle
      truck: vehicle
      bus: vehicle
    drop: []
