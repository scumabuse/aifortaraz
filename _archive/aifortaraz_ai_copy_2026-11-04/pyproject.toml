[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "safety-ai"
version = "1.0.0"
description = "AI module of the Digital Safety Inspector platform: real-time occupational-safety event detection on industrial camera streams."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Digital Safety Inspector team" }]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "ultralytics>=8.3.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "httpx>=0.27",
  "websockets>=12.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
  "structlog>=24.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "imagehash>=4.3",
  "Pillow>=10.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "psutil>=5.9",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "shapely>=2.0",
  "types-PyYAML>=6.0",
  "types-psutil>=5.9",
  "onnx>=1.16",
  "onnxslim>=0.1.30",
  "onnxruntime>=1.18",
]
preview = ["opencv-python>=4.9"]
cuda = ["tensorrt>=10.0; platform_system != 'Darwin'"]
openvino = ["openvino>=2024.0"]
onnx = ["onnx>=1.16", "onnxslim>=0.1.30", "onnxruntime>=1.18"]
data = ["kagglehub>=0.3", "gdown>=5.0"]

[project.scripts]
safety-ai = "safety_ai.cli:main"

[project.urls]
Documentation = "https://github.com/ultralytics/ultralytics"

[tool.hatch.build.targets.wheel]
packages = ["safety_ai", "tools"]

[tool.hatch.build.targets.sdist]
include = ["safety_ai", "tools", "configs", "datasets", "docs", "tests", "README.md", "requirements.lock"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "runs", "models", "mock_data", "cache", "spool", "events", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "D100", "D101", "D102", "D103", "D106", "PL", "T20"]
ignore = [
  "PLR0911",  # many return statements are fine in small dispatchers
  "PLR0912",
  "PLR0913",  # constructors with many injected dependencies are intentional
  "PLR0915",
  "PLR2004",  # numeric thresholds come straight from the specification
  "RUF001",   # unicode in strings (arrows, multiplication signs) is intentional
  "RUF002",
  "RUF003",
  "PLW0603",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR", "T20", "N802", "N806"]
"tools/**" = ["T20"]
"safety_ai/cli.py" = ["T20", "PLC0415", "B008"]
"safety_ai/training/**" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["^data/", "^runs/", "^models/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["safety_ai.logic.*", "safety_ai.backend.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 600
markers = [
  "e2e: end-to-end tests that load the real models",
  "integration: tests that talk to the mock backend over real HTTP/WebSocket",
  "scenario: deterministic scenario suite (detector bypassed)",
  "slow: tests that take more than ~10 seconds",
]
filterwarnings = [
  "ignore::DeprecationWarning:websockets.*",
  "ignore::DeprecationWarning:uvicorn.*",
]

[tool.coverage.run]
source = ["safety_ai"]
omit = ["safety_ai/training/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "raise AssertionError",
  "if __name__ == .__main__.:",
]
