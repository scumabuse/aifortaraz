# Integration demo: the AI module next to the real website backend (aifortaraz/safety-inspector).
#
#   1. build the demo videos once:   python tools/make_demo_videos.py
#   2. the API key and the backend URL come from the integration root: `make init` writes the
#      seeded key (SEED_AI_API_KEY = SAFETY_AI_API_KEY) and SAFETY_AI_BACKEND_URL into safety-ai/.env;
#      standalone, export SAFETY_AI_API_KEY yourself (PowerShell: $env:SAFETY_AI_API_KEY = "...")
#   3. safety-ai run --config configs/demo_integration.yaml
#
# Zones, thresholds and PPE types come from the website (GET /api/v1/ingest/config, re-read every
# 60 s and on config.updated, cached in cache/). The website shows the annotated video straight
# from http://localhost:8001/stream/<camera>.mjpeg, so the MJPEG server listens on every interface
# (output.expose). The zones files below are used only without a backend
# (SAFETY_AI_BACKEND__ENABLED=false). Camera ids cam-1 and cam-2 match the website's seeded cameras.

backend:
  url: ${SAFETY_AI_BACKEND_URL:-http://127.0.0.1:8000}
  api_key: ${SAFETY_AI_API_KEY}
  ws: true
  push_frames: false

models:
  ppe: ppe_cppe_latest  # Construction-PPE YOLO26n (registry alias); SH17 fallback: ppe_n_latest
  pose: pose_n
  vehicle: same_as_ppe
  imgsz: 640
  device: auto

processing:
  target_fps: 10

output:
  expose: true
  mjpeg_port: 8001

telemetry:
  metrics_port: 9100

cameras:
  - id: cam-1
    source: data/samples/cam1.mp4
    # A live webcam instead of the demo video: replace the source line above with
    # source: 0
    loop: true
    timezone: ${TZ:-Asia/Yekaterinburg}
    zones_file: tools/demo_zones_cam1.yaml
  - id: cam-2
    source: data/samples/cam2.mp4
    loop: true
    timezone: ${TZ:-Asia/Yekaterinburg}
    zones_file: tools/demo_zones_cam2.yaml
