backend:
  url: http://localhost:8000
  api_key: ${SAFETY_AI_API_KEY}
  ws: true
  push_frames: false
  timeout_s: 5
models:
  ppe: ppe_s_latest
  pose: pose_n
  vehicle: same_as_ppe
  backend: auto          # auto | pt | onnx | openvino | tensorrt
  device: auto           # auto | cpu | cuda:0 | mps
  imgsz: 640
  half: true
thresholds:
  conf: 0.25
  iou: 0.5
  confirm_frames: 8
  cooldown_sec: 60
  violation_on: -0.3
  present_on: 0.1
  track_lost_s: 3
  immobile_sec: 30
processing:
  target_fps: 12
  pose_every_n: 10
output:
  mjpeg_port: 8001
  mjpeg_fps: 12
  save_event_clips: true
  events_dir: ./events
  events_disk_cap_gb: 2
  preview: false
privacy:
  blur_faces: false
telemetry:
  metrics_port: 9100
  log_level: INFO
  log_json: true
cameras:
  - id: cam-1
    source: data/samples/press.mp4
    loop: true
    timezone: Asia/Yekaterinburg
  - id: cam-2
    source: rtsp://user:pass@192.168.1.10/live
    timezone: Asia/Yekaterinburg
