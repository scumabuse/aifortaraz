# Camera configurations served by the strict mock backend (tools/mock_backend.py).
#
# Every entry has exactly the structure of the contract's GET /api/v1/ingest/config/{camera_id}
# response (docs/CONTRACT.md 4.4) without "version" and "updated_at": the mock starts every camera
# at version 1 and bumps it on POST /debug/reload-config and POST /debug/set-config/{camera_id}.
# Schedules use the contract's days 1..7 (1 = Monday ... 7 = Sunday, ISO weekdays) in the camera's
# local time. Times in schedules must be quoted ("20:00"), otherwise YAML reads them as numbers.
#
# Together the cameras cover every rule kind: required_ppe (all nine PPE codes, several
# combinations including vest and harness), entry_forbidden, max_persons, min_vehicle_distance_m,
# a weekday daytime schedule, per-zone confirm_frames / cooldown_sec overrides, severity_override,
# camera thresholds and a restricted ppe_types list. The stream URLs are examples: the mock only
# reports them and never opens them.
#
# cam-1 is the camera of the end-to-end run (1280x720 synthetic video, people across the middle
# of the frame): a large PPE zone over almost the whole floor plus a smaller danger zone.

cameras:
  - camera:
      id: cam-1
      name: "Press shop, line 2 - press #2"
      stream_url: "rtsp://192.168.10.21:554/Streaming/Channels/101"
      stream_type: rtsp
    frame_size_hint: [1280, 720]
    thresholds:
      confirm_frames: 8
      cooldown_sec: 60
      min_confidence: 0.5
    ppe_types: [helmet, vest, glasses, gloves, mask, boots, earmuffs, harness, face_shield]
    zones:
      - id: cam1-shop-floor
        name: "Press shop floor"
        type: ppe
        polygon: [[0.03, 0.10], [0.97, 0.10], [0.97, 0.99], [0.03, 0.99]]
        rules:
          required_ppe: [helmet, vest]
          entry_forbidden: null
          max_persons: null
          min_vehicle_distance_m: null
          schedule: null
          confirm_frames: null
          cooldown_sec: null
          severity_override: null
      - id: cam1-press-danger
        name: "Press #2 danger area"
        type: danger
        polygon: [[0.62, 0.28], [0.88, 0.26], [0.90, 0.74], [0.60, 0.76]]
        rules:
          required_ppe: null
          entry_forbidden: true
          max_persons: 3
          min_vehicle_distance_m: null
          schedule: null
          confirm_frames: 6
          cooldown_sec: 30
          severity_override: null

